# docker-compose.full.yml — добавляем backend + frontend
# NOTE: поле version устарело в Docker Compose v2+ и убрано намеренно

# Включает всё из docker-compose.yml + добавляет backend и frontend.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.full.yml up -d

x-bounded-logs: &bounded-logs
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  backend:
    logging: *bounded-logs
    tmpfs:
      - /tmp/sphere-metrics:rw,nosuid,nodev,noexec,size=128m,uid=1001,gid=1001,mode=0700
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    environment:
      - PYTHONPATH=/app
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-sphere}:${POSTGRES_PASSWORD}@postgres:5432/sphereplatform
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCOUNT_CREDENTIAL_KEYS=${ACCOUNT_CREDENTIAL_KEYS:-}
      - SCREENSHOT_STORAGE_ENDPOINT=${SCREENSHOT_STORAGE_ENDPOINT:-}
      - SCREENSHOT_STORAGE_ACCESS_KEY=${SCREENSHOT_STORAGE_ACCESS_KEY:-}
      - SCREENSHOT_STORAGE_SECRET_KEY=${SCREENSHOT_STORAGE_SECRET_KEY:-}
      - SCREENSHOT_STORAGE_SECURE=${SCREENSHOT_STORAGE_SECURE:-true}
      - SCREENSHOT_STORAGE_REGION=${SCREENSHOT_STORAGE_REGION:-us-east-1}
      - WG_ROUTER_URL=${WG_ROUTER_URL}
      - WG_ROUTER_API_KEY=${WG_ROUTER_API_KEY}
      - AWG_H1=${AWG_H1}
      - AWG_H2=${AWG_H2}
      - AWG_H3=${AWG_H3}
      - AWG_H4=${AWG_H4}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SPHERE_BOOTSTRAP_ORG_SLUG=${SPHERE_BOOTSTRAP_ORG_SLUG:-default}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - CORS_EXTRA_ORIGINS=${CORS_EXTRA_ORIGINS:-}
      - DEV_SKIP_AUTH=${DEV_SKIP_AUTH:-false}
      - SPHERE_UPDATES_PATH=/app/backend/updates/releases.json
      - SPHERE_LOGS_DIR=/var/lib/sphere/device-logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app                          # весь проект — backend.* импорты работают
      - /app/backend/__pycache__        # изолируем кэш
      - ./backend/updates:/app/backend/updates  # OTA catalog + APK artifacts
      - device_logs:/var/lib/sphere/device-logs
    command: >
      sh -c '
        if [ "$ENVIRONMENT" = "development" ]; then
          exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend
        else
          exec /bin/sh /app/backend/docker-entrypoint.sh gunicorn backend.main:app
            --config backend/gunicorn_conf.py
            --worker-class uvicorn.workers.UvicornWorker
            --workers ${WEB_CONCURRENCY:-4}
            --bind 0.0.0.0:8000
            --graceful-timeout 30
            --timeout 120
            --keep-alive 65
            --max-requests 10000
            --max-requests-jitter 1000
            --access-logfile -
        fi
      '
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    healthcheck:
      # Probe dependencies through the API; a running process alone is insufficient.
      test:
        - CMD
        - python
        - -c
        - "import json, sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/readyz', timeout=3); sys.exit(0 if r.status == 200 and json.load(r).get('status') == 'ready' else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  frontend:
    logging: *bounded-logs
    build:
      context: ./frontend
      dockerfile: Dockerfile
    user: "0"                    # root — нужно для записи в .next/ под Windows bind mount
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=
      - NEXT_PUBLIC_DEV_SKIP_AUTH=${DEV_SKIP_AUTH:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # Linux-бинарники, не мешает хостовому node_modules
      - frontend_next_cache:/app/.next            # изолируем .next/ — хостовые артефакты prod-build ломают dev-сервер
    # Turbopack вместо webpack: нет eval() → нет "Code generation from strings disallowed" в Edge runtime
    command: ["sh", "-c", "npm install && npx next dev --turbopack -p 3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login', {redirect: 'manual', signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - frontend-net

  # Override nginx из base docker-compose.yml — добавляем depends_on
  nginx:
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  frontend_node_modules:   # Linux-совместимый node_modules, персистентный между перезапусками
  frontend_next_cache:     # dev-server .next/ кэш, изолирован от хостовых prod-артефактов
