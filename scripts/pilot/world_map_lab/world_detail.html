<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <link rel="icon" href="data:," /><title>
    Black Russia · Детальная 3D-сцена
  </title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101a20;
      color: #edf2ed;
      font:
        16px/1.5 "Segoe UI",
        sans-serif;
    }
    main {
      max-width: 1600px;
      margin: auto;
      padding: clamp(12px, 2.4vw, 34px);
    }
    header,
    .tools,
    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1.05;
      margin: 4px 0;
    }
    small,
    .foot {
      color: #b4c6ca;
    }
    .card {
      background: #18282e;
      border: 1px solid #3a4a50;
      border-radius: 14px;
      overflow: hidden;
    }
    .tools,
    .foot {
      padding: 12px 16px;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    nav,
    form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    a,
    button,
    select,
    input {
      font: inherit;
      border: 1px solid #475b60;
      border-radius: 7px;
      background: #14232a;
      color: #e6f4ee;
      padding: 6px 10px;
      text-decoration: none;
    }
    button {
      background: #a8ecd4;
      color: #16372c;
      cursor: pointer;
    }
    input {
      width: 100px;
    }
    [hidden] {
      display: none !important;
    }
    body.capture main {
      padding: 0;
      max-width: none;
    }
    body.capture header,
    body.capture .tools,
    body.capture .foot {
      display: none;
    }
    body.capture .card {
      border: 0;
      border-radius: 0;
    }
    body.capture canvas {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: clamp(360px, 64vh, 820px);
      touch-action: none;
    }
    #status {
      font-variant-numeric: tabular-nums;
    }
    .foot {
      font-size: 14px;
    }
    a:hover {
      border-color: #a8ecd4;
    }
  </style>
  <main>
    <header>
      <div>
        <small>BLACK RUSSIA · ИСХОДНЫЕ МОДЕЛИ ARIANE</small>
        <h1>Детальная 3D-сцена</h1>
      </div>
      <nav><a href="/review">Карта разрывов</a><a href="/">Планировщик</a></nav>
    </header>
    <section class="card">
      <div class="tools">
        <form id="params">
          <label
            >X
            <input
              id="x"
              type="number"
              step="any"
              required
              value="562" /></label
          ><label
            >Y
            <input
              id="y"
              type="number"
              step="any"
              required
              value="2560" /></label
          ><label
            >Z
            <input
              id="z"
              type="number"
              step="any"
              required
              value="12.4" /></label
          ><label
            >Радиус
            <select id="radius">
              <option>48</option>
              <option>96</option>
              <option>160</option>
              <option>320</option>
              <option>640</option>
              <option selected>960</option>
            </select></label
          ><button>Открыть участок</button>
        </form>
        <div>
          <label
            >Камера
            <select id="view">
              <option value="orbit">Обзор</option>
              <option value="first">От первого лица</option>
            </select></label
          >
          <span id="angles" hidden
            ><label
              >Курс, ° <input type="number" step="any" id="yaw" value="0"
            /></label>
            <label
              >Наклон, °
              <input
                type="number"
                min="-85"
                max="85"
                step="any"
                id="pitch"
                value="2" /></label
          ></span>
        </div>
        <span id="status" role="status">Загрузка участка…</span>
      </div>
      <canvas aria-label="Трёхмерная сцена выбранного участка"></canvas>
      <div class="foot">
        <span id="hint"
          >Перетаскивание — поворот · Колесо — приближение · Правая кнопка —
          сдвиг</span
        ><span>Координаты и расстояния в игровых единицах</span>
      </div>
    </section>
  </main>
  <script type="importmap">
    { "imports": { "three": "/detail/js/three.module.js" } }
  </script>
  <script type="module">
    import * as T from "three";
    import { GLTFLoader } from "/detail/js/GLTFLoader.js";
    import { OrbitControls } from "/detail/js/OrbitControls.js";
    const $ = (s) => document.querySelector(s),
      canvas = $("canvas"),
      status = $("#status"),
      params = new URLSearchParams(location.search);
    for (const k of ["x", "y", "z", "radius"])
      if (params.has(k)) $("#" + k).value = params.get(k);
    const capture = params.get("capture") === "1";
    const maxRadius = await fetch("/api/world")
      .then((r) => (r.ok ? r.json() : {}))
      .then((info) => [320, 640, 960].includes(info.detailMaxRadius) ? info.detailMaxRadius : 320)
      .catch(() => 320);
    const radiusPicker = $("#radius");
    for (const option of radiusPicker.options)
      option.disabled = Number(option.value) > maxRadius;
    if (!radiusPicker.value || Number(radiusPicker.value) > maxRadius)
      radiusPicker.value = String(maxRadius);
    if (capture && !params.has("radius")) radiusPicker.value = "96";
    document.body.classList.toggle("capture", capture);
    for (const id of ["view", "yaw", "pitch"])
      if (params.has(id)) $("#" + id).value = params.get(id);
    const hfov = Number(params.get("hfov") ?? 90);
    if (!Number.isFinite(hfov) || hfov < 30 || hfov > 145)
      throw Error("Invalid horizontal field of view");
    let renderer;
    try {
      renderer = new T.WebGLRenderer({ canvas, antialias: true });
    } catch {
      status.textContent = "Для вращения сцены требуется WebGL 2.";
      throw Error("WebGL unavailable");
    }
    renderer.setPixelRatio(capture ? 1 : Math.min(devicePixelRatio, 1.6));
    renderer.setClearColor(0x99b7c3);
    const scene = new T.Scene(),
      camera = new T.PerspectiveCamera(49, 1, 0.25, 4000);
    camera.up.set(0, 0, 1);
    const eye = new T.PerspectiveCamera(60, 1, 0.15, 4000);
    eye.up.set(0, 0, 1);
    let ready = false,
      sector = null;
    function positionEye(x, y, z, yaw, pitch, roll = 0) {
      if (
        ![x, y, z, yaw, pitch, roll].every(Number.isFinite) ||
        Math.abs(pitch) > 85
      )
        throw Error("Invalid viewpoint");
      const a = T.MathUtils.degToRad(yaw),
        v = T.MathUtils.degToRad(pitch);
      eye.position.set(x, y, z);
      eye.lookAt(
        x + Math.cos(a) * Math.cos(v),
        y + Math.sin(a) * Math.cos(v),
        z + Math.sin(v),
      );
      eye.rotateZ(-T.MathUtils.degToRad(roll));
    }
    function syncView() {
      const first = $("#view").value === "first";
      controls.enabled = !first;
      $("#angles").hidden = !first;
      $("#hint").textContent = first
        ? "Камера на 1,48 ед. выше выбранной отметки Z. Курс 0° направлен вдоль +X, 90° вдоль +Y."
        : "Перетаскивание — поворот · Колесо — приближение · Правая кнопка — сдвиг";
      if (sector)
        positionEye(
          sector.x,
          sector.y,
          sector.z + 1.48,
          Number($("#yaw").value),
          Number($("#pitch").value),
        );
      const url = new URL(location.href);
      for (const id of ["view", "yaw", "pitch"])
        url.searchParams.set(id, $("#" + id).value);
      history.replaceState(null, "", url);
      draw();
    }
    const controls = new OrbitControls(camera, canvas);
    controls.maxPolarAngle = Math.PI * 0.96;
    controls.maxDistance = 1100;
    const hemi = new T.HemisphereLight(0xffffff, 0xb3a69a, 2.15);
    hemi.up.set(0, 0, 1);
    hemi.position.set(0, 0, 1);
    scene.add(hemi);
    const sun = new T.DirectionalLight(0xffedd5, 1.75);
    sun.position.set(-80, -60, 150);
    scene.add(sun);
    let group = new T.Group();
    scene.add(group);
    let pending = false;
    function draw() {
      if (!pending) {
        pending = true;
        requestAnimationFrame(() => {
          pending = false;
          renderer.render(scene, $("#view").value === "first" ? eye : camera);
        });
      }
    }
    controls.addEventListener("change", draw);
    new ResizeObserver(() => {
      const w = canvas.clientWidth,
        h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      eye.aspect = w / h;
      eye.fov = T.MathUtils.radToDeg(
        2 * Math.atan(Math.tan(T.MathUtils.degToRad(hfov) / 2) / eye.aspect),
      );
      eye.updateProjectionMatrix();
      draw();
    }).observe(canvas);
    const manager = new T.LoadingManager();
    let resourceError = false;
    manager.onError = () => {
      resourceError = true;
    };
    const loader = new GLTFLoader(manager);
    function disposeGroup(root) {
      const mats = new Set(),
        geos = new Set(),
        textures = new Set();
      root.traverse((obj) => {
        if (obj.isMesh) {
          if (obj.isInstancedMesh) obj.dispose();
          geos.add(obj.geometry);
          for (const mat of [].concat(obj.material)) {
            mats.add(mat);
            if (mat.map) textures.add(mat.map);
          }
        }
      });
      geos.forEach((g) => g.dispose());
      mats.forEach((m) => m.dispose());
      textures.forEach((t) => {
        t.dispose();
        t.source.data?.close?.();
      });
      root.clear();
    }
    async function load() {
      const submit = $("button");
      submit.disabled = true;
      const wasReady = ready;
      let next = null;
      ready = false;
      resourceError = false;
      try {
        const p = new URLSearchParams();
        for (const k of ["x", "y", "z", "radius"]) p.set(k, $("#" + k).value);
        const addr = new URL(location.href);
        for (const [key, v] of p) addr.searchParams.set(key, v);
        const x = +p.get("x"),
          y = +p.get("y"),
          z = +p.get("z"),
          rad = +p.get("radius");
        status.textContent = "Поиск видимых моделей…";
        const res = await fetch("/api/neighborhood?" + p);
        if (!res.ok) throw Error("neighborhood");
        const data = await res.json();
        next = new T.Group();
        const anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
        let cursor = 0,
          done = 0,
          tris = 0,
          n = 0;
        async function worker() {
          while (cursor < data.length) {
            const entry = data[cursor++],
              asset = await loader.loadAsync(
                new URL("/detail/model/" + entry.id + ".glb", location.href)
                  .href,
              );
            asset.scene.updateMatrixWorld(true);
            asset.scene.traverse((mesh) => {
              if (!mesh.isMesh) return;
              if (!mesh.geometry.attributes.normal)
                mesh.geometry.computeVertexNormals();
              for (const material of [mesh.material].flat()) {
                if (material.map && material.map.anisotropy !== anisotropy) {
                  material.map.anisotropy = anisotropy;
                  material.map.needsUpdate = true;
                }
              }
              const inst = new T.InstancedMesh(
                mesh.geometry,
                mesh.material,
                entry.instances.length,
              );
              const matrix = new T.Matrix4(),
                pos = new T.Vector3(),
                quat = new T.Quaternion(),
                scale = new T.Vector3(1, 1, 1);
              entry.instances.forEach((t, i) => {
                pos.fromArray(t);
                quat.fromArray(t, 3);
                matrix.compose(pos, quat, scale).multiply(mesh.matrixWorld);
                inst.setMatrixAt(i, matrix);
              });
              inst.computeBoundingSphere();
              next.add(inst);
            });
            tris += entry.triangles * entry.instances.length;
            n += entry.instances.length;
            done++;
            if (done % 8 === 0 || done === data.length)
              status.textContent = done + "/" + data.length + " моделей";
          }
        }
        const all = await Promise.allSettled(
          Array.from({ length: Math.min(6, data.length) }, worker),
        );
        if (resourceError || all.some((v) => v.status === "rejected"))
          throw Error("model");
        scene.remove(group);
        disposeGroup(group);
        group = next;
        next = null;
        scene.add(group);
        sector = { x, y, z, rad };
        renderer.clippingPlanes = [
          new T.Plane(new T.Vector3(1, 0, 0), rad - x),
          new T.Plane(new T.Vector3(-1, 0, 0), x + rad),
          new T.Plane(new T.Vector3(0, 1, 0), rad - y),
          new T.Plane(new T.Vector3(0, -1, 0), y + rad),
        ];
        controls.target.set(x, y, z);
        camera.position.set(x + rad * 0.6, y - rad * 0.72, z + rad * 0.58);
        controls.update();
        history.replaceState(null, "", addr);
        syncView();
        status.textContent =
          n.toLocaleString("ru") +
          " объектов · " +
          tris.toLocaleString("ru") +
          " треугольников";
        ready = n > 0;
        if (!n) status.textContent = "В выбранном объёме исходных моделей нет.";
        draw();
      } catch (e) {
        if (next) disposeGroup(next);
        ready = wasReady;
        status.textContent = "Не удалось загрузить все модели участка.";
        console.error(e);
      } finally {
        submit.disabled = false;
      }
    }
    for (const id of ["view", "yaw", "pitch"]) $("#" + id).onchange = syncView;
    if (capture) {
      // Only the simulated camera uses truth. The observer receives decoded RGB alone.
      window.captureMapEye = async ({ x, y, z, yaw, pitch, roll = 0 }) => {
        if (!ready || !sector || ![x, y, z].every(Number.isFinite))
          throw Error("Camera or scene unavailable");
        if (
          Math.max(Math.abs(x - sector.x), Math.abs(y - sector.y)) >
            sector.rad * 0.72 ||
          Math.abs(z - sector.z) > 36
        ) {
          // The simulator streams geometry around its camera. Only the resulting RGB leaves this renderer.
          $("#x").value = x;
          $("#y").value = y;
          $("#z").value = z - 1.48;
          await load();
          if (!ready) throw Error("Cannot load the next exterior sector");
        }
        positionEye(x, y, z, yaw, pitch, roll);
        renderer.render(scene, eye);
        return canvas.toDataURL("image/png");
      };
    }
    $("#params").onsubmit = (e) => {
      e.preventDefault();
      load();
    };
    load();
  </script>
</html>
