name: ⚡ Стабильность, скорость и recovery
description: Краш, зависание, задержка, нагрузка, потеря связи или неудачное восстановление.
title: '[Runtime]: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'Спасибо за конкретное описание. Сначала проверьте [известные проблемы](https://github.com/RootOne1337/sphere-platform/blob/codex/enterprise-audit-20260905/docs/audits/2026-09-20/FLEET32-PREFLIGHT.md).
      Репозиторий публичный: не прикладывайте пароли, tokens, cookies, `.env`, signing/enrollment keys и raw logs.
      Уязвимости — через [приватный report](https://github.com/RootOne1337/sphere-platform/security/advisories/new).'
- type: dropdown
  id: component
  attributes:
    label: Компонент
    multiple: true
    options:
    - Backend / API
    - PostgreSQL
    - Redis
    - Android APK
    - Web UI / streaming
    - Оркестрация / задачи
    - PC-agent
    - VPN
    - Docker / deployment / discovery
    - Пока не определён
  validations:
    required: true
- type: dropdown
  id: impact
  attributes:
    label: Наблюдаемое влияние
    multiple: false
    options:
    - Весь рабочий контур недоступен
    - Часть устройств или заданий не работает
    - Работа продолжается с задержками / обрывами
    - Нужна проверка наблюдаемого поведения
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Версии и окружение
    description: Backend/frontend commit или image, APK versionName/versionCode, Android/root/эмулятор, способ запуска.
      Неизвестные версии так и отметьте. Без конфигураций с секретами.
  validations:
    required: true
- type: textarea
  id: workload
  attributes:
    label: Нагрузка и топология
    description: Число устройств/viewers/tasks, аппаратные ресурсы, профиль видео, LAN/WAN/VPN и где расположен
      сервер. Без приватных адресов и ключей.
  validations:
    required: true
- type: textarea
  id: timeline
  attributes:
    label: Что произошло и когда
    description: Время/часовой пояс, действия до отказа, симптом, длительность, автоматическое или ручное восстановление,
      PID до/после, если известны.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Как должно было работать
    description: Ожидаемый результат, свежесть кадров/latency/receipt и фактическое измерение. Неизмеренные показатели
      отметьте.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Очищенное evidence
    description: Короткий временной фрагмент, CPU/RAM/network, crash summary, task/command ID. Отделяйте online
      от новых кадров и успешного terminal result.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Перед отправкой
    options:
    - label: 'Проверил описание и вложения: секреты и персональные данные удалены.'
      required: true
