name: ✨ Новый сценарий
description: Пользовательская задача, ожидаемое поведение и критерий приёмки.
title: '[Feature]: '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: 'Спасибо за конкретное описание. Сначала проверьте [известные проблемы](https://github.com/RootOne1337/sphere-platform/blob/codex/enterprise-audit-20260905/docs/audits/2026-09-20/FLEET32-PREFLIGHT.md).
      Репозиторий публичный: не прикладывайте пароли, tokens, cookies, `.env`, signing/enrollment keys и raw logs.
      Уязвимости — через [приватный report](https://github.com/RootOne1337/sphere-platform/security/advisories/new).'
- type: textarea
  id: problem
  attributes:
    label: Какую задачу решаем
    description: Для кого, как часто и почему текущего поведения недостаточно. Проверьте ROADMAP.
  validations:
    required: true
- type: textarea
  id: behavior
  attributes:
    label: Желаемое поведение
    description: Конкретный сценарий от входных данных до результата.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Как проверим результат
    description: Наблюдаемые критерии, ограничения по нагрузке/latency и отказам. Новая функция не должна отменять
      проверку восстановления.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Альтернативы и совместимость
    description: Текущий workaround, затронутые компоненты, миграции и варианты решения.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Перед отправкой
    options:
    - label: 'Проверил описание и вложения: секреты и персональные данные удалены.'
      required: true
