name: 🐛 Ошибка в работе
description: Воспроизводимый дефект с версиями, шагами и фактическим результатом.
title: '[Bug]: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'Спасибо за конкретное описание. Сначала проверьте [известные проблемы](https://github.com/RootOne1337/sphere-platform/blob/codex/enterprise-audit-20260905/docs/audits/2026-09-20/FLEET32-PREFLIGHT.md).
      Репозиторий публичный: не прикладывайте пароли, tokens, cookies, `.env`, signing/enrollment keys и raw logs.
      Уязвимости — через [приватный report](https://github.com/RootOne1337/sphere-platform/security/advisories/new).'
- type: dropdown
  id: component
  attributes:
    label: Компонент
    multiple: true
    options:
    - Backend / API
    - PostgreSQL
    - Redis
    - Android APK
    - Web UI / streaming
    - Оркестрация / задачи
    - PC-agent
    - VPN
    - Docker / deployment / discovery
    - Пока не определён
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: Что не работает
    description: Опишите конкретный пользовательский сценарий и влияние.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Версии и окружение
    description: Backend/frontend commit или image, APK versionName/versionCode, Android/root/эмулятор, способ запуска.
      Неизвестные версии так и отметьте. Без конфигураций с секретами.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Как воспроизвести
    description: Последовательность шагов, ожидаемый результат и фактический результат. Если сбой редкий — условия
      наблюдения.
  validations:
    required: true
- type: textarea
  id: timeline
  attributes:
    label: Время и идентификаторы
    description: Время с часовым поясом, task/pipeline/command ID и обезличенный device ID. Не публикуйте чужие
      данные.
  validations:
    required: false
- type: textarea
  id: evidence
  attributes:
    label: Доказательство и уже проверенное
    description: Короткий очищенный лог, screenshot или receipt; частота сбоя, workaround и действия, которые уже
      пробовали.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Перед отправкой
    options:
    - label: 'Проверил описание и вложения: секреты и персональные данные удалены.'
      required: true
