name: 📚 Документация
description: Нерабочая инструкция, ссылка, устаревший статус или недостающий пример.
title: '[Docs]: '
labels:
- documentation
body:
- type: markdown
  attributes:
    value: 'Спасибо за конкретное описание. Сначала проверьте [известные проблемы](https://github.com/RootOne1337/sphere-platform/blob/codex/enterprise-audit-20260905/docs/audits/2026-09-20/FLEET32-PREFLIGHT.md).
      Репозиторий публичный: не прикладывайте пароли, tokens, cookies, `.env`, signing/enrollment keys и raw logs.
      Уязвимости — через [приватный report](https://github.com/RootOne1337/sphere-platform/security/advisories/new).'
- type: textarea
  id: location
  attributes:
    label: Документ и место
    description: Ссылка, заголовок, ветка/commit и фрагмент, который требует исправления.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Что непонятно или неверно
    description: Какой шаг выполняли, что ожидали, что произошло; для команды укажите ОС и версию.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Предлагаемое исправление
    description: Если есть проверенный пример или актуальное evidence, приведите его без секретов.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Перед отправкой
    options:
    - label: 'Проверил описание и вложения: секреты и персональные данные удалены.'
      required: true
