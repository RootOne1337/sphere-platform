name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish signed enterprise APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3

      - name: Validate release tag and source version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_version="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' android/version.properties)"
          test "${GITHUB_REF_NAME#v}" = "$source_version"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Prepare the configured production signing key
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          test -n "$ANDROID_RELEASE_CERT_SHA256"
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sphere-release.jks"
          test -s "$RUNNER_TEMP/sphere-release.jks"

      - name: Build the enterprise release APK
        working-directory: android
        env:
          SPHERE_KEYSTORE_PATH: ${{ runner.temp }}/sphere-release.jks
          SPHERE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SPHERE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SPHERE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew test lint assembleEnterpriseRelease

      - name: Verify package, version, and release-certificate continuity
        shell: bash
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/enterprise/release/app-enterprise-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual_cert="$("$apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]]
          test "$actual_cert" = "$expected_cert"
          source_version="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' android/version.properties)"
          source_code="$(awk -F= '$1 == "VERSION_CODE" { print $2 }' android/version.properties)"
          metadata="$("$aapt" dump badging "$apk" | sed -n '1p')"
          [[ "$metadata" == *"name='com.sphereplatform.agent'"* ]]
          [[ "$metadata" == *"versionCode='$source_code'"* ]]
          [[ "$metadata" == *"versionName='$source_version'"* ]]
          sha256sum "$apk" > android/app/build/outputs/apk/enterprise/release/SHA256SUMS

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --verbose --latest

      - name: Publish verified enterprise APK
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/enterprise/release/app-enterprise-release.apk
            android/app/build/outputs/apk/enterprise/release/SHA256SUMS
