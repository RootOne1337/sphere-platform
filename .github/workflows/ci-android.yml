name: CI — Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    name: Android tests and signed release smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      - name: Create a disposable CI-only signing key
        env:
          CI_KEY_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/sphere-ci-signing.jks" \
            -storepass "$CI_KEY_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias sphere-ci \
            -dname "CN=Sphere CI Only, OU=Non-production, O=Sphere, C=US" \
            -keyalg RSA -keysize 2048 -validity 2

      - name: Test all variants and build signed release smoke APKs
        working-directory: android
        env:
          SPHERE_KEYSTORE_PATH: ${{ runner.temp }}/sphere-ci-signing.jks
          SPHERE_KEYSTORE_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
          SPHERE_KEY_ALIAS: sphere-ci
          SPHERE_KEY_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./gradlew test lint assembleDebug assembleDevRelease assembleEnterpriseRelease

      - name: Verify release smoke APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose android/app/build/outputs/apk/dev/release/app-dev-release.apk
          "$apksigner" verify --verbose android/app/build/outputs/apk/enterprise/release/app-enterprise-release.apk

      - name: Upload debug-only APKs and unit-test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-diagnostics-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/*/debug/*.apk
            android/app/build/test-results/test*/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Verify ordinary APKs exclude experimental WebRTC JNI
        run: |
          python - <<'PY'
          import pathlib, zipfile
          apks = list(pathlib.Path('android/app/build/outputs/apk').glob('*/*/*.apk'))
          assert apks
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  assert not any(name.endswith('libjingle_peerconnection_so.so') for name in archive.namelist()), apk
                  assert not any(b'Lorg/webrtc/' in archive.read(name) for name in archive.namelist() if name.endswith('.dex')), apk
          print('WebRTC JNI absent from all ordinary debug/release APKs')
          PY

      - name: Compile and test isolated direct-transport debug canary
        working-directory: android
        env:
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
        run: ./gradlew clean testDevDebugUnitTest assembleDevDebug

      - name: Verify canary JNI packaging and release denial
        working-directory: android
        env:
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/dev/debug/app-dev-debug.apk') as archive:
              native = {name.split('/')[1] for name in archive.namelist() if name.endswith('libjingle_peerconnection_so.so')}
          assert native == {'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'}, native
          print('Four admitted WebRTC JNI ABIs packaged')
          PY
          if ./gradlew assembleDevRelease > "$RUNNER_TEMP/direct-probe-release-denial.log" 2>&1; then
            echo 'Experimental direct transport unexpectedly allowed a release APK' >&2
            exit 1
          fi
          grep -q 'Direct transport is a diagnostic debug canary' "$RUNNER_TEMP/direct-probe-release-denial.log"

      - name: Upload direct-transport canary diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: android-direct-probe-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/dev/debug/*.apk
            android/app/build/test-results/testDevDebugUnitTest/**/*.xml
          if-no-files-found: error
          retention-days: 3
