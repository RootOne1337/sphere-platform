name: CI — Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
      - ".github/workflows/release.yml"
      - "scripts/build_awg_native.py"
      - "scripts/pilot/resource_guard.py"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
      - ".github/workflows/release.yml"
      - "scripts/build_awg_native.py"
      - "scripts/pilot/resource_guard.py"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Android tests and signed release smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      - name: Create a disposable CI-only signing key
        env:
          CI_KEY_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/sphere-ci-signing.jks" \
            -storepass "$CI_KEY_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias sphere-ci \
            -dname "CN=Sphere CI Only, OU=Non-production, O=Sphere, C=US" \
            -keyalg RSA -keysize 2048 -validity 2

      - name: Test all variants and build signed release smoke APKs
        working-directory: android
        env:
          SPHERE_KEYSTORE_PATH: ${{ runner.temp }}/sphere-ci-signing.jks
          SPHERE_KEYSTORE_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
          SPHERE_KEY_ALIAS: sphere-ci
          SPHERE_KEY_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./gradlew test lint assembleDebug assembleDevRelease assembleEnterpriseRelease

      - name: Verify release smoke APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose android/app/build/outputs/apk/dev/release/app-dev-release.apk
          "$apksigner" verify --verbose android/app/build/outputs/apk/enterprise/release/app-enterprise-release.apk

      - name: Upload debug-only APKs and unit-test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-diagnostics-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/*/debug/*.apk
            android/app/build/test-results/test*/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Verify ordinary APKs exclude experimental WebRTC JNI
        run: |
          python - <<'PY'
          import pathlib, zipfile
          apks = list(pathlib.Path('android/app/build/outputs/apk').glob('*/*/*.apk'))
          assert apks
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  assert not any(name.endswith(('libjingle_peerconnection_so.so', 'libwg-go.so')) for name in archive.namelist()), apk
                  assert not any(b'Lorg/webrtc/' in archive.read(name) for name in archive.namelist() if name.endswith('.dex')), apk
          print('Experimental WebRTC and WG/AWG JNI absent from ordinary APKs')
          PY

      - name: Compile and test isolated direct-transport debug canary
        working-directory: android
        env:
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
        run: ./gradlew clean testDevDebugUnitTest assembleDevDebug

      - name: Verify canary JNI packaging and release denial
        working-directory: android
        env:
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/dev/debug/app-dev-debug.apk') as archive:
              native = {name.split('/')[1] for name in archive.namelist() if name.endswith('libjingle_peerconnection_so.so')}
          assert native == {'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'}, native
          print('Four admitted WebRTC JNI ABIs packaged')
          PY
          if ./gradlew assembleDevRelease > "$RUNNER_TEMP/direct-probe-release-denial.log" 2>&1; then
            echo 'Experimental direct transport unexpectedly allowed a release APK' >&2
            exit 1
          fi
          grep -q 'Direct transport is a diagnostic debug canary' "$RUNNER_TEMP/direct-probe-release-denial.log"

      - name: Verify controlled local STUN build gates
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if SPHERE_DIRECT_PROBE_STUN_URL=stun:10.0.2.2:3478 ./gradlew help > "$RUNNER_TEMP/stun-gate-denial.log" 2>&1; then
            echo 'Controlled STUN unexpectedly allowed without the direct debug gate' >&2
            exit 1
          fi
          grep -q 'Controlled STUN requires SPHERE_DIRECT_TRANSPORT_CANARY=true' "$RUNNER_TEMP/stun-gate-denial.log"
          for endpoint in 'stun:example.com:3478' 'stun:8.8.8.8:3478' 'stun:010.0.2.2:3478' 'stun:10.0.2.2:3478?transport=udp'; do
            if SPHERE_DIRECT_TRANSPORT_CANARY=true SPHERE_DIRECT_PROBE_STUN_URL="$endpoint" ./gradlew help > "$RUNNER_TEMP/stun-profile-denial.log" 2>&1; then
              echo 'Non-local or non-canonical controlled STUN profile unexpectedly allowed' >&2
              exit 1
            fi
            grep -q 'Controlled STUN requires one canonical RFC1918 IPv4 endpoint' "$RUNNER_TEMP/stun-profile-denial.log"
          done

      - name: Compile and test the controlled local STUN debug profile
        working-directory: android
        env:
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
          SPHERE_DIRECT_PROBE_STUN_URL: "stun:10.0.2.2:3478"
        run: ./gradlew testDevDebugUnitTest assembleDevDebug

      - name: Compile and test the explicit public STUN debug profile
        working-directory: android
        env:
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
          SPHERE_DIRECT_PROBE_STUN_URL: "stun:stun.cloudflare.com:3478"
        run: ./gradlew testDevDebugUnitTest assembleDevDebug

      - name: Test the combined planar video and continuous direct-input debug profile
        working-directory: android
        env:
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
          SPHERE_DIRECT_PROBE_STUN_URL: "stun:stun.cloudflare.com:3478"
          SPHERE_STREAM_GPU_BRIDGE: "false"
          SPHERE_STREAM_PLANAR_INPUT: "true"
          SPHERE_CONTINUOUS_INPUT_CANARY: "true"
          SPHERE_DEV_APPLICATION_ID_SUFFIX: ".pilot"
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./gradlew --max-workers=2 testDevDebugUnitTest testEnterpriseDebugUnitTest lintDevDebug lintEnterpriseDebug assembleDevDebug assembleEnterpriseDebug

      - name: Upload direct-transport canary diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: android-direct-probe-public-stun-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/dev/debug/*.apk
            android/app/build/test-results/testDevDebugUnitTest/**/*.xml
          if-no-files-found: error
          retention-days: 3

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: false

      - name: Build the pinned three-ABI WG/AWG provider
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install 'ndk;26.3.11579264'
          python scripts/build_awg_native.py \
            --ndk-root "$ANDROID_HOME/ndk/26.3.11579264" \
            --android-clock --harden-jni \
            --output "$RUNNER_TEMP/sphere-awg-native"

      - name: Test the single-APK VPN and direct-control candidate
        working-directory: android
        env:
          SPHERE_APP_SCOPED_VPN_CANARY: "true"
          SPHERE_AWG_NATIVE_DIR: ${{ runner.temp }}/sphere-awg-native
          SPHERE_DIRECT_TRANSPORT_CANARY: "true"
          SPHERE_DIRECT_PROBE_STUN_URL: "stun:stun.cloudflare.com:3478"
          SPHERE_STREAM_GPU_BRIDGE: "false"
          SPHERE_STREAM_PLANAR_INPUT: "true"
          SPHERE_CONTINUOUS_INPUT_CANARY: "true"
          SPHERE_DEV_APPLICATION_ID_SUFFIX: ".pilot"
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./gradlew --max-workers=2 testDevDebugUnitTest testEnterpriseDebugUnitTest lintDevDebug lintEnterpriseDebug assembleDevDebug assembleEnterpriseDebug

      - name: Verify single-APK native contents and VPN release denial
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          native = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sphere-awg-native'
          manifest = json.loads((native / 'manifest.json').read_text())
          assert manifest['runtime_sleep_clock_patch_applied'] is True
          assert manifest['jni_lifecycle_hardened'] is True
          assert {row['abi'] for row in manifest['artifacts']} == {'x86_64', 'arm64-v8a', 'armeabi-v7a'}
          for variant in ('dev', 'enterprise'):
              apk = pathlib.Path(f'android/app/build/outputs/apk/{variant}/debug/app-{variant}-debug.apk')
              with zipfile.ZipFile(apk) as archive:
                  actual = {p for p in archive.namelist() if p.endswith('/libwg-go.so')}
                  expected = {f"lib/{row['abi']}/libwg-go.so" for row in manifest['artifacts']}
                  assert actual == expected, variant
                  for row in manifest['artifacts']:
                      assert hashlib.sha256(archive.read(f"lib/{row['abi']}/libwg-go.so")).hexdigest() == row['sha256'], variant
          print('Dev/Enterprise VPN APKs contain the verified three-ABI provider')
          PY
          if SPHERE_APP_SCOPED_VPN_CANARY=true SPHERE_AWG_NATIVE_DIR="$RUNNER_TEMP/sphere-awg-native" \
            android/gradlew -p android assembleDevRelease > "$RUNNER_TEMP/app-vpn-release-denial.log" 2>&1; then
            echo 'VPN canary unexpectedly allowed a release APK' >&2
            exit 1
          fi
          grep -q 'App-scoped VPN is a debug canary' "$RUNNER_TEMP/app-vpn-release-denial.log"

      - name: Upload single-APK VPN candidate and native evidence
        uses: actions/upload-artifact@v6
        with:
          name: android-app-vpn-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/outputs/apk/*/debug/*.apk
            android/app/build/test-results/test*DebugUnitTest/**/*.xml
            android/app/build/reports/lint-results-*.xml
            ${{ runner.temp }}/sphere-awg-native/manifest.json
          if-no-files-found: error
          retention-days: 7
