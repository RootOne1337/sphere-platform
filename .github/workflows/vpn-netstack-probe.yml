name: VPN independent netstack probe
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/vpn-netstack-probe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache-dependency-path: tools/vpn-netstack-probe/go.sum
      - run: go test -mod=readonly ./...
      - name: Cross-build a driverless Windows diagnostic
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -mod=readonly -trimpath -o vpn-netstack-probe.exe .
      - name: Bind executable to source
        env:
          SOURCE: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          p = pathlib.Path('vpn-netstack-probe.exe')
          proof = {'sourceRevision': os.environ['SOURCE'], 'runId': int(os.environ['RUN_ID']),
                   'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes': p.stat().st_size,
                   'privateConfigurationInBuild': False}
          pathlib.Path('receipt.json').write_text(json.dumps(proof))
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: vpn-netstack-probe-${{ github.sha }}
          path: |
            tools/vpn-netstack-probe/vpn-netstack-probe.exe
            tools/vpn-netstack-probe/receipt.json
          retention-days: 3
