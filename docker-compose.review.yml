# An isolated production build for local review against an existing backend.
# Requires SPHERE_REVIEW_API_NETWORK to identify that backend's Docker network.
services:
  review-ui:
    image: sphere-review-frontend:${SPHERE_REVIEW_BUILD_SHA:?Set the reviewed commit SHA}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${SPHERE_REVIEW_BUILD_SHA:?Set the reviewed commit SHA}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      OBSERVABILITY_AUTH_API_URL: http://review-gateway:8080/api/v1/
      OBSERVABILITY_PROMETHEUS_URL: ${OBSERVABILITY_PROMETHEUS_URL:-}
      OBSERVABILITY_GRAFANA_URL: ${OBSERVABILITY_GRAFANA_URL:-}
      OBSERVABILITY_SESSION_SECRET: ${OBSERVABILITY_SESSION_SECRET:-}
      OBSERVABILITY_SECURE_COOKIE: "false"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
      - /app/.next/cache:rw,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=0700
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login', {redirect:'manual',signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      review:
        ipv4_address: ${SPHERE_REVIEW_UI_IP:-172.30.0.3}
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  review-gateway:
    image: nginx:alpine
    entrypoint:
      - /bin/sh
      - -ec
      - "envsubst '$$SPHERE_REVIEW_UI_IP' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf; exec nginx -c /tmp/nginx.conf -g 'daemon off;'"
    environment:
      SPHERE_REVIEW_UI_IP: ${SPHERE_REVIEW_UI_IP:-172.30.0.3}
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700"]
    volumes:
      - ./infrastructure/nginx/review.conf:/etc/nginx/nginx.conf.template:ro
    ports:
      - "127.0.0.1:${SPHERE_REVIEW_PORT:-3015}:8080"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/login && wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      review-ui: {condition: service_healthy}
    networks: [review, existing-api]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

networks:
  review:
    name: ${SPHERE_REVIEW_NETWORK:-sphere-review-stable_ui}
    internal: true
    ipam:
      config:
        - subnet: ${SPHERE_REVIEW_SUBNET:-172.30.0.0/24}
          ip_range: ${SPHERE_REVIEW_DYNAMIC_RANGE:-172.30.0.128/25}
          gateway: ${SPHERE_REVIEW_NETWORK_GATEWAY:-172.30.0.1}
  existing-api:
    external: true
    name: ${SPHERE_REVIEW_API_NETWORK:?Set the existing backend network}
