rule_files: [rules.yml]
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: 'up{job="sphere-backend",instance="archive"}'
    values: '1+0x20'
  - series: 'up{job="sphere-backend",instance="old-build"}'
    values: '1+0x20'
  - series: 'sphere_device_log_filesystem_available{job="sphere-backend",instance="archive"}'
    values: '1+0x20'
  - series: 'sphere_device_log_filesystem_free_bytes{job="sphere-backend",instance="archive"}'
    values: '20+0x3 5+0x16'
  - series: 'sphere_device_log_filesystem_total_bytes{job="sphere-backend",instance="archive"}'
    values: '100+0x20'
  - series: 'sphere_device_log_retention_last_success_timestamp_seconds{job="sphere-backend",instance="archive"}'
    values: '0+60x4 240+0x15'
  - series: 'sphere_android_ota_unrecognized_receipts_total{job="sphere-backend",instance="archive",outcome="warning"}'
    values: '0+1x20'
  - series: 'sphere_android_ota_unrecognized_receipts_total{job="sphere-backend",instance="archive",outcome="suppressed"}'
    values: '0+0x5 0+2x15'
  alert_rule_test:
  - eval_time: 4m
    alertname: SphereDeviceLogFilesystemLowSpace
    exp_alerts: []
  - eval_time: 7m
    alertname: SphereDeviceLogRetentionStalled
    exp_alerts: []
  - eval_time: 10m
    alertname: SphereDeviceLogFilesystemLowSpace
    exp_alerts:
    - exp_labels: {job: sphere-backend, instance: archive, severity: warning}
      exp_annotations:
        summary: Device journal filesystem has less than 10% free space
        description: Check the filesystem hosting the journal and competing writers on that filesystem.
  - eval_time: 10m
    alertname: SphereDeviceLogFilesystemUnobservable
    exp_alerts:
    - exp_labels: {job: sphere-backend, instance: old-build, severity: warning}
      exp_annotations:
        summary: Backend metrics are reachable but journal filesystem capacity is unavailable
        description: Check the configured journal directory and whether the backend revision exports filesystem metrics.
  - eval_time: 15m
    alertname: SphereDeviceLogRetentionStalled
    exp_alerts:
    - exp_labels: {job: sphere-backend, instance: archive, severity: warning}
      exp_annotations:
        summary: No recent device journal retention scan was confirmed
        description: Check the journal lifecycle, filesystem permissions, and lock contention.
  - eval_time: 5m
    alertname: SphereAndroidOtaReceiptRepeated
    exp_alerts: []
  - eval_time: 15m
    alertname: SphereAndroidOtaReceiptRepeated
    exp_alerts:
    - exp_labels: {job: sphere-backend, instance: archive, severity: warning}
      exp_annotations:
        summary: Android keeps sending OTA receipts the backend cannot match
        description: Look for android_ws.ota_recovery_receipt_unrecognized and its summaries in the backend journal.
