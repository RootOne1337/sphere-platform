<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sphere Platform</title>
  <desc id="desc">Управление Android, локальная автоматизация и восстановление связи. Абстрактная схема: центральный узел и устройства распределённого парка.</desc>
