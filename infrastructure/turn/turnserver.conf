# Linux host-network template; verify public/NAT addressing before exposure.
# If the host is behind NAT, configure external-ip=PUBLIC/PRIVATE and preserve
# the relay UDP port numbers on the forwarding gateway.
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349
cert=/run/secrets/turn-tls-chain.pem
pkey=/run/secrets/turn-tls-key.pem
realm=sphere-direct
use-auth-secret
fingerprint
cli=false
no-tcp-relay
no-multicast-peers
# This pinned version defaults to TLS >=1.2; legacy no-tlsv1 options were removed.
cpus=2
relay-threads=1
min-port=49200
max-port=49327
user-quota=8
total-quota=64
max-allocate-lifetime=120
max-bps=1048576
bps-capacity=20971520
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
userdb=/tmp/turndb
pidfile=/tmp/turnserver.pid
