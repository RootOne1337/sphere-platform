worker_processes auto;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # No query strings or credentials in tunnel-facing access logs.
    log_format pilot '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout pilot;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 32m;
        # Private bootstrap config contains an enrollment key. Internet discovery
        # is a separate, generated allowlist document containing routes only.
        location = /api/v1/config/agent {
            alias /public/agent.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
        location = /api/v1/config/agent/ { return 308 /api/v1/config/agent; }
        location = /metrics { return 404; }
        location / {
            set $pilot_upstream http://nginx:80;
            proxy_pass $pilot_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
    }
}
