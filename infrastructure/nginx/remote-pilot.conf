worker_processes auto;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Opt-in per public hostname. Without a reviewed pilot map the original
    # frontend remains the default. Never route Android/API traffic by this map.
    map $host $pilot_web_upstream {
        default http://nginx:8081;
        include /public/web-upstream*.map;
    }
    # No query strings or credentials in tunnel-facing access logs. Host
    # distinguishes independent ingress routes; bytes/completion describe only
    # gateway-to-connector transfer, not arrival at the Android client.
    log_format pilot '$remote_addr $host $request_method $uri $status '
                     '$request_time $body_bytes_sent $upstream_response_length '
                     '$request_completion';
    access_log /dev/stdout pilot;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 32m;
        proxy_http_version 1.1;
        # Retain the public origin, including when the optional UI relay is used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        # The same reviewed UI also serves loopback HTTP. Its short-lived,
        # encrypted Grafana cookie must be Secure on this HTTPS-only ingress.
        proxy_cookie_flags sphere_observability secure;
        # Private bootstrap config contains an enrollment key. Internet discovery
        # is a separate, generated allowlist document containing routes only.
        location = /api/v1/config/agent {
            alias /public/agent.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
        location = /api/v1/config/agent/ { return 308 /api/v1/config/agent; }
        location = /bootstrap/agent.signed.json {
            alias /public/agent.signed.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
        location = /metrics { return 404; }
        # Next.js owns these authenticated handlers, not the business API.
        location ~ ^/api/observability(?:/|$) {
            proxy_pass $pilot_web_upstream;
        }
        location /api/ {
            set $pilot_upstream http://nginx:8081;
            proxy_pass $pilot_upstream;
        }
        location /ws/ {
            set $pilot_upstream http://nginx:8081;
            proxy_pass $pilot_upstream;
        }
        location = /health {
            set $pilot_upstream http://nginx:8081;
            proxy_pass $pilot_upstream;
        }
        # The authenticated Next bridge streams decoded Grafana assets. Compress
        # only static files on the public hop; API, video and bootstrap are untouched.
        location ^~ /observability/grafana/public/ {
            gzip on;
            gzip_proxied any;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_comp_level 4;
            gzip_types application/javascript text/javascript text/css image/svg+xml;
            proxy_pass $pilot_web_upstream;
        }
        location / {
            proxy_pass $pilot_web_upstream;
        }
    }
}
