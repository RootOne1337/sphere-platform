# Local review gateway. The Compose host binding is loopback only.
# Business API and device agents remain on their existing server.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $review_connection {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_next_upstream off;

        set $review_ui http://review-ui:3000;
        set $review_api http://backend:8000;

        location = / {
            return 307 /dashboard;
        }

        location ~ ^/api/v1(?:/|$) {
            # Preserve the accepted local relay's API origin contract.
            proxy_set_header Host 127.0.0.1:18080;
            proxy_set_header Origin http://127.0.0.1:18080;
            proxy_set_header Referer http://127.0.0.1:18080/;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass $review_api$request_uri;
        }

        location /ws/ {
            proxy_set_header Host 127.0.0.1:18080;
            proxy_set_header Origin http://127.0.0.1:18080;
            proxy_set_header Referer http://127.0.0.1:18080/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $review_connection;
            proxy_pass $review_api$request_uri;
        }

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass $review_ui$request_uri;
        }
    }
}
